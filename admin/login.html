<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"]}}}}</script>
<title>Login Admin - HubDemo</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
<div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
  <div class="text-center mb-6"><h2 class="text-xl font-bold text-white">Login Panel Pengelola</h2><p class="text-xs text-slate-400 mt-1">Masuk memakai GitHub Personal Access Token milikmu.</p></div>
  <div id="error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center"></div>
  <form id="login-form" class="space-y-4">
    <div><label class="block text-xs font-medium text-slate-300 mb-1">Repo (username/nama-repo)</label><input id="repo" required placeholder="bangas/hubdemo" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-emerald-500"></div>
    <div><label class="block text-xs font-medium text-slate-300 mb-1">Branch</label><input id="branch" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-emerald-500"></div>
    <div><label class="block text-xs font-medium text-slate-300 mb-1">Personal Access Token</label><input type="password" id="token" required placeholder="github_pat_..." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-emerald-500"><p class="text-[11px] text-slate-500 mt-1">Fine-grained token, izin <b>Contents: Read and write</b>, khusus repo ini. Disimpan di browser ini saja.</p></div>
    <button id="btn-login" type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-slate-950 font-semibold rounded-xl text-sm">Masuk ke Panel Admin</button>
    <div class="text-center pt-2"><a href="../" class="text-xs text-slate-500 hover:text-slate-300">← Kembali ke Katalog Publik</a></div>
  </form>
</div>
<script type="module" src="../js/login.js"></script>
</body></html>
